[package]
name = "cappy-core"
description = "Retained widget tree, reactive signals and damage tracking for the cappy GUI framework"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Software-renderer builds. Motion is crate-private: other crates cannot name `Motion` or call
# `Context::animate`, so a use is a compile error.
cpu = []

[dependencies]
cappy-style.workspace = true
cappy-layout.workspace = true
unicode-segmentation.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
resvg.workspace = true
log.workspace = true

# OS TLS for https. wasm loads URLs with the browser's fetch instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
native-tls = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Response"] }

# `std::time::Instant` cannot be read on wasm32-unknown-unknown. Only that target
# pulls in the browser clock; native builds keep `std`.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
web-time.workspace = true

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
