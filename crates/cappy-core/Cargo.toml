[package]
name = "cappy-core"
description = "Retained widget tree, reactive signals and damage tracking for the cappy GUI framework"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cappy-style.workspace = true
cappy-layout.workspace = true

# `std::time::Instant` cannot be read on wasm32-unknown-unknown. Only that target
# pulls in the browser clock; native builds keep `std`.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
web-time.workspace = true

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
