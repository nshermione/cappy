[package]
name = "cappy-render"
description = "wgpu renderer with damage-region repainting for the cappy GUI framework"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cappy-core.workspace = true
cappy-text.workspace = true
cappy-host.workspace = true
wgpu.workspace = true
glyphon.workspace = true
bytemuck.workspace = true
log.workspace = true

# Browser builds need a WebGL fallback and Send/Sync wgpu types without shared-memory atomics.
# Native builds do not see these features.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl", "fragile-send-sync-non-atomic-wasm"] }

[lints]
workspace = true
