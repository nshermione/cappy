[package]
name = "cappy-testing"
description = "Test harness for cappy: headless UI driver and GPU snapshot helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
gpu-tests = ["dep:cappy-render", "dep:wgpu", "dep:pollster", "dep:png"]

[dependencies]
cappy-core.workspace = true
cappy-render = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
png = { workspace = true, optional = true }

[dev-dependencies]
cappy-dsl.workspace = true

[lints]
workspace = true
