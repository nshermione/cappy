[package]
name = "web-demo"
description = "cappy playground hosted in a browser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
playground-scenes = { workspace = true, features = ["gpu"] }
cappy = { workspace = true, default-features = false, features = ["basic"] }
log.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"

[lints]
workspace = true
