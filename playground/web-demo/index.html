<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cappy playground</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0e1116;
        color: #e7e5e4;
        font-family: sans-serif;
      }

      #boot {
        padding: 16px;
      }

      body:has(canvas) #boot {
        display: none;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <p id="boot">Loading cappy…</p>
    <link data-trunk rel="rust" />
  </body>
</html>
