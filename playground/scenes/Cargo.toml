[package]
name = "playground-scenes"
description = "Shared UI scenes used by every cappy playground host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
default = []
gpu = ["dep:cappy-winit", "cappy-winit/gpu"]
cpu = ["dep:cappy-winit", "cappy-winit/cpu", "cappy/cpu"]

[dependencies]
cappy = { workspace = true, features = ["basic"] }
cappy-winit = { workspace = true, optional = true }
env_logger.workspace = true

[dev-dependencies]
cappy-testing.workspace = true

[lints]
workspace = true
