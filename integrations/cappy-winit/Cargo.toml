[package]
name = "cappy-winit"
description = "winit integration for the cappy GUI framework"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["gpu"]
# wgpu renderer.
gpu = ["dep:cappy-render", "dep:pollster"]
# tiny-skia + softbuffer renderer: no GPU driver, much less memory.
cpu = ["dep:cappy-render-cpu"]

[dependencies]
cappy-core.workspace = true
cappy-host.workspace = true
cappy-text.workspace = true
cappy-render = { workspace = true, optional = true }
cappy-render-cpu = { workspace = true, optional = true }
winit.workspace = true
pollster = { workspace = true, optional = true }
log.workspace = true

# `getrandom` is pulled in by winit. The wasm target has no OS entropy source until this feature
# is on. `wasm-bindgen-futures` drives the async GPU surface open; the browser cannot block.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Window"] }

[lints]
workspace = true
