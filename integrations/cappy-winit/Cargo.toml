[package]
name = "cappy-winit"
description = "winit integration for the cappy GUI framework"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cappy-core.workspace = true
cappy-host.workspace = true
cappy-text.workspace = true
cappy-render.workspace = true
winit.workspace = true
pollster.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3"

# `getrandom` is pulled in by winit. The wasm target has no OS entropy source until this feature
# is on. `wasm-bindgen-futures` drives the async GPU surface open; the browser cannot block.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Window"] }

[lints]
workspace = true
